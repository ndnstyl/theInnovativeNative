  - iXLTnTbvk0MACjur   # Cerebro — Fleet Alert Relay
  - 4iqs92G6xkAPRjcd   # Cerebro RAG — Query API

memory_anchors:
  - outreach_machine
  - revenue_content_engine
  - project_dea_growth_audit
  - feedback_bust_demand_at_seams
  - feedback_napkin_math_until_data_access
  - n8n_workflow_status

verification:
  - "outreach copy passes the mike-voice fingerprint; no em dashes incl &mdash;"
  - "outbound funnel shape per feedback_sandy_riley_funnel_shape (post-call nurture + cancel recovery, NOT 24/7 inbound SDR)"
  - "lead claims are operator-scale signals, not unverified specific numbers (feedback_researcher_data_fallible)"
  - "every send is GATED to Mike; nothing auto-activates (n8n-rules: Mike is the only tester)"
  - "any workflow change scored 8+/10 via n8n-check before hand-off"

entrypoints:
  - "source N leads in <niche>"
  - "draft a cold email / outreach sequence"
  - "build a funnel for X"
  - "score and prioritize these leads"
  - "research this prospect / company"
  - "reactivate dead leads"
  - "write a LinkedIn outreach / connection message"
  - "audit the outreach fleet health"
