domain: growth-marketing
title: Growth Marketing
description: >
  Lead sourcing + enrichment, outreach cadences (email + LinkedIn), funnels, demand generation,
  social distribution, and the closed-loop analytics behind them. The execution muscle is the
  Cerebro outreach fleet in n8n; the brain drafts the copy + strategy and hands sends to Mike.
autonomy: full_ship
gates: [n8n_activation, outward_send, prod_deploy]

brand_rules:
  - feedback_linkedin_viral_mechanics
  - feedback_riley_pattern
  - feedback_no_em_dashes
  - feedback_sandy_riley_funnel_shape
  - feedback_pixel_control_day_1
  - feedback_outside_in_calibration

skills:
  primary: [deep-research, mike-voice]
  support: [ingest, distill, mcp-client]

agents: [orchestrator, researcher, implementer, reviewer]

# Active Cerebro outreach fleet (resolved against n8n-fleet.json).
n8n_workflows:
  - 76ZmsMqUYMsr397j   # Cerebro — Lead Capture
  - 2Jgg7MoKTdYjAA0L   # Cerebro — Lead Sourcing (Apify, In-Scope)
  - 7SK2OhvDkNsPdvlq   # Cerebro — PhantomBuster LinkedIn Connect
  - JAUGjjme3fJroTeE   # Cerebro — LinkedIn Warmth Scorer
  - jkcT0okhldb1wRTW   # Cerebro — Lead Scoring
  - I9AsM9a4cKEpK4Nq   # Cerebro — Contact Enrichment Loop
  - KE4qKzENtfGNP68A   # Cerebro — Outreach Engine
  - UCQHsPbbC6rWcJVA   # Cerebro — Outreach Kill-Switch
  - 0xX7kqaspZrPITSQ   # Cerebro — Reply Classifier
  - gK6DcJzUE1hsIDUf   # Cerebro — Daily Health Check
