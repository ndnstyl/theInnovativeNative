domain: market-research
title: Market Research
description: >
  Deep multi-source web research, competitor + pain-point mapping, niche validation, and cited
  reports. Outside-in by default — calibrate confidence, distrust specific numbers, and re-attack
  with ground truth when a domain expert corrects you.
autonomy: full_ship
gates: [outward_send, prod_deploy]

brand_rules:
  - feedback_outside_in_calibration
  - feedback_researcher_data_fallible
  - feedback_adversarial_review_survives_ground_truth
  - feedback_no_em_dashes

skills:
  primary: [deep-research, perplexity]
  support: [ingest, synthesize, distill]

agents: [orchestrator, researcher, reviewer]

n8n_workflows:
  - PAWDc7Mx0CEEqiD8   # Agentic RAG Template
  - R1TOXPjxHNPXvvct   # Cerebro — Daily Legal Digest
  - 4iqs92G6xkAPRjcd   # Cerebro RAG — Query API

memory_anchors:
  - reference_ai_systems_architect_market
  - reference_karpathy_llm_wiki_pattern
  - project_dea_growth_audit
  - concept_llm_wiki_pattern

verification:
  - "outside-in claims carry a soft calibration disclaimer (feedback_outside_in_calibration)"
  - "specific numbers cross-checked or labeled; operator-scale signals preferred (feedback_researcher_data_fallible)"
  - "report claims cite their raw source per the wiki citation discipline"
  - "no em dashes incl &mdash;"

entrypoints:
  - "research the X market / industry"
  - "map competitors for X"
  - "validate this niche"
  - "map customer pain points in X"
  - "write a cited research report on X"
  - "deep research <question>"
