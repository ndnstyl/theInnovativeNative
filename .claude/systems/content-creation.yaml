verification:
  - "no em dashes anywhere, including &mdash; / &#8212; entities on the LIVE render"
  - "video routed per feedback_video_tool_routing (HyperFrames agent-end-to-end vs Remotion Mike-directed)"
  - "palette per feedback_inn_native_cyan_primary (cyan primary, magenta rare); caption highlight = cyan + 1.18x"
  - "copy passes the mike-voice fingerprint (car-analogy cornerstone, no LLM tells)"
  - "reel structure per feedback_reel_critique_round1 (no text before VO, b-roll matches content, music always)"

entrypoints:
