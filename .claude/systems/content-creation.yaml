domain: content-creation
title: Content Creation
description: >
  Reels, shorts, carousels, blog posts, captions, scripts, quote cards, content calendars —
  written and produced in Mike's voice and brand. Covers the TIN marketing content machine and
  the social/blog publishing fleet. Video routing splits HyperFrames (agent end-to-end) vs
  Remotion (Mike-directed); deep Remotion work belongs to the remotion-design pack.
autonomy: full_ship
gates: [n8n_activation, outward_send, prod_deploy]

